<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تسجيل الدخول - storek</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com/3.4.17" type="text/javascript"></script>
  <style>
    body { font-family: "DM Sans", sans-serif; background: #f7f6ef; color: #17211e; }
  </style>
</head>
<body class="flex items-center justify-center min-h-screen px-4">
  <div class="w-full max-w-md bg-[#fcfbf7] border border-[#d9ded7] rounded-[2rem] p-8 shadow-sm">
    <div class="text-center mb-6">
      <h1 class="text-3xl font-bold text-[#155e52] font-serif">storek</h1>
      <p class="text-sm text-[#64716c] mt-1">سجل الدخول لإدارة متجرك</p>
    </div>

    <form id="login-form" class="space-y-4">
      <div>
        <label for="username" class="block text-sm font-semibold mb-2">اسم المستخدم أو البريد</label>
        <input type="text" id="username" required class="w-full rounded-xl border border-[#bfcac2] bg-white px-4 py-3 focus:outline-none focus:ring-4 focus:ring-[#d4ef58]">
      </div>
      <div>
        <label for="password" class="block text-sm font-semibold mb-2">كلمة المرور</label>
        <input type="password" id="password" required class="w-full rounded-xl border border-[#bfcac2] bg-white px-4 py-3 focus:outline-none focus:ring-4 focus:ring-[#d4ef58]">
      </div>
      <button type="submit" class="w-full bg-[#155e52] text-white font-bold py-3 rounded-xl hover:bg-[#0f4a40] transition">دخول</button>
    </form>
    
    <div id="error-msg" class="text-red-600 text-sm mt-3 text-center hidden">بيانات الدخول غير صحيحة</div>
  </div>

  <script>
    document.getElementById('login-form').addEventListener('submit', function(e) {
      e.preventDefault();
      const user = document.getElementById('username').value.trim();
      const pass = document.getElementById('password').value.trim();
      
      // مثال بسيط للتحقق الثابت (يمكنك تعديله لاحقاً)
      if (user === 'admin' && pass === '123456') {
        // توجيه المالك إلى المتجر مع تفعيل وضع الإدارة
        window.location.href = 'index.html#owner-storek';
      } else {
        document.getElementById('error-msg').classList.remove('hidden');
      }
    });
  </script>
</body>
</html>
